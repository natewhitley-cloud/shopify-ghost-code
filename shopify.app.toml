# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3e80de5fa6065400e94de3f1fe7f0c8b"
name = "ghost-code"
application_url = "https://shopify-ghost-code-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions/update"

  [[webhooks.subscriptions]]
  topics = [ "themes/publish" ]
  uri = "/webhooks/themes/publish"

  # GDPR mandatory webhooks
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

[access_scopes]
# Ghost Code only needs to read themes — no write access required
scopes = "read_themes"
# Optional scopes — requested via App Bridge scopes modal
optional_scopes = ["read_translations", "read_products", "read_content", "read_online_store_navigation"]

[auth]
redirect_urls = [ "https://shopify-ghost-code-production.up.railway.app/auth/callback" ]
