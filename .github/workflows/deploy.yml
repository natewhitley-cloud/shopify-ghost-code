# Required GitHub Secrets:
# - RAILWAY_TOKEN: Railway API token (from railway.app/account/tokens)
# - RAILWAY_SERVICE_ID: Railway service ID for the ghost-code web service
# - HEALTH_CHECK_TOKEN: shared secret for the /health/deep ops endpoint
#   (must match the HEALTH_CHECK_TOKEN env var set on the Railway service)
# - SMOKE_BASE_URL: public base URL of the deployed service,
#   e.g. https://shopify-ghost-code-production.up.railway.app

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # Write the commit SHA into the build context BEFORE railway up so Docker
      # can COPY it into the runtime image. RAILWAY_GIT_COMMIT_SHA is only set
      # for repo-linked deploys, not CLI (railway up) deploys — we inject it.
      - name: Write deploy SHA to build context
        run: echo "$GITHUB_SHA" > .deploy-sha
      - name: Deploy to Railway
        run: railway up --service=${{ secrets.RAILWAY_SERVICE_ID }}
      # Best-effort log scan: report ERROR/FATAL markers from the fresh deploy
      # but never fail the build on them (continue-on-error + grep || echo).
      # Stays in this job because it needs the railway CLI (present in this container).
      - name: Scan deploy logs for errors
        if: always()
        continue-on-error: true
        run: |
          railway logs --service=${{ secrets.RAILWAY_SERVICE_ID }} 2>/dev/null \
            | grep -E "ERROR|FATAL" || echo "No ERROR/FATAL markers found in recent logs"

  # Runs on a normal runner (NOT the railway CLI container, which has no Node)
  # so `node scripts/smoke.mjs` can actually execute. Gated on the deploy job.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      # BLOCKING GATE (BEAD-4, enabled 2026-07-02 after a verified-green CI run):
      # a failed smoke fails this job and turns the workflow red. Note it does NOT
      # roll back the deploy — the deploy job already ran — it's a red-alert signal
      # that prod is degraded. smoke.mjs is dependency-free — no npm ci needed.
      #
      # EXPECTED_SHA (GC-59t, BLOCKING since GC-7ml): the smoke compares
      # body.deployedSha (written to .deploy-sha by the deploy job, baked into
      # the Docker image) against github.sha. A mismatch fails the gate — soft-
      # launch observed ✓ green on 2 consecutive deploys (33ad905, 91a0a04).
      - name: Post-deploy smoke test
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/smoke.mjs
